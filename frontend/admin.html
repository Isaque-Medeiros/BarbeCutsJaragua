<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Barbe City Jaraguá</title>
    <meta name="description" content="Painel administrativo da Barbe City Jaraguá.">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/img/logo.jpeg" type="image/jpeg">
</head>
<body>
    <!-- Login -->
    <div class="admin-login-overlay" id="login-overlay">
        <div class="card admin-login-card">
            <div class="card-header" style="text-align:center;">
                <div style="font-size:2.5rem;margin-bottom:0.5rem;">🔐</div>
                <span class="card-title">Acesso Admin</span>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <input type="password" id="admin-secret-input" class="form-input" placeholder="Senha secreta" onkeypress="if(event.key==='Enter')loginAdmin()">
                </div>
                <button class="btn btn-primary btn-block" onclick="loginAdmin()">Entrar</button>
                <div id="login-error" class="text-danger text-center hidden" style="margin-top:0.5rem;">Senha inválida.</div>
            </div>
        </div>
    </div>

    <div id="admin-app" class="hidden">
        <nav class="navbar scrolled" id="navbar">
            <div class="container">
                <a href="/" class="navbar-brand">
                    <img src="/img/logo.jpeg" alt="BarbeCuts" class="navbar-logo">
                    <div class="navbar-brand-text">Barbe City<span>Admin</span></div>
                </a>
                <div class="navbar-links">
                    <button class="btn btn-sm" style="background:var(--danger);color:#fff;border:none;padding:0.4rem 1rem;" onclick="logoutAdmin()">🔒 Sair</button>
                </div>
            </div>
        </nav>

        <section class="page-section" style="padding-top:6rem;">
            <div class="container">
                <div class="section-title reveal">
                    <h2>📊 Painel <span class="highlight">Admin</span></h2>
                    <div class="gold-divider"></div>
                </div>

                <!-- Tabs principais -->
                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="agendamentos" onclick="trocarAba('agendamentos',this)">📅 Agendamentos</button>
                    <button class="admin-tab" data-tab="financeiro" onclick="trocarAba('financeiro',this)">💰 Financeiro</button>
                    <button class="admin-tab" data-tab="servicos" onclick="trocarAba('servicos',this)">✂️ Serviços</button>
                    <button class="admin-tab" data-tab="config" onclick="trocarAba('config',this)">⚙️ Config</button>
                </div>

                <!-- TAB AGENDAMENTOS -->
                <div class="admin-tab-content active" id="tab-agendamentos">
                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;">
                        <button class="admin-tab active" onclick="carregarAgendamentos('hoje',this)" data-periodo="hoje">📅 Hoje</button>
                        <button class="admin-tab" onclick="carregarAgendamentos('semana',this)" data-periodo="semana">📆 Semana</button>
                        <button class="admin-tab" onclick="carregarAgendamentos('mes',this)" data-periodo="mes">🗓️ Mês</button>
                        <button class="admin-tab" onclick="carregarAgendamentos('todos',this)" data-periodo="todos">📋 Todos</button>
                    </div>
                    <div id="agendamentos-list"><p class="text-muted">Carregando...</p></div>
                </div>

                <!-- TAB FINANCEIRO -->
                <div class="admin-tab-content" id="tab-financeiro">
                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;">
                        <button class="admin-tab active" onclick="carregarFinanceiro('hoje',this)" data-fperiodo="hoje">Hoje</button>
                        <button class="admin-tab" onclick="carregarFinanceiro('semana',this)" data-fperiodo="semana">Semana</button>
                        <button class="admin-tab" onclick="carregarFinanceiro('mes',this)" data-fperiodo="mes">Mês</button>
                    </div>
                    <div class="stats-grid" id="financeiro-stats"></div>
                    <div id="financeiro-detalhes" style="margin-top:1rem;"></div>
                </div>

                <!-- TAB SERVIÇOS -->
                <div class="admin-tab-content" id="tab-servicos">
                    <div style="display:flex;gap:1rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap;">
                        <button class="btn btn-primary" onclick="mostrarFormServico()">➕ Novo Serviço</button>
                        <button class="btn btn-sm" style="background:var(--border);color:var(--light);" onclick="carregarServicos()">🔄 Atualizar</button>
                    </div>
                    <div id="servicos-list"><p class="text-muted">Carregando...</p></div>
                    <div id="servico-form" class="card hidden" style="max-width:500px;margin-top:1rem;">
                        <div class="card-header"><span class="card-title" id="servico-form-title">Novo Serviço</span></div>
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label">Nome</label>
                                <input type="text" id="sf-nome" class="form-input" placeholder="Corte Degradê">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Descrição</label>
                                <input type="text" id="sf-descricao" class="form-input" placeholder="Corte degradê com navalha">
                            </div>
                            <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                                <div class="form-group">
                                    <label class="form-label">Duração (min)</label>
                                    <input type="number" id="sf-duracao" class="form-input" value="40">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Valor (R$)</label>
                                    <input type="number" id="sf-valor" class="form-input" step="0.01" value="50">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Categoria / Tipo</label>
                                <select id="sf-tipo" class="form-input">
                                    <option value="principal">💈 Principal (Corte)</option>
                                    <option value="adicional">🧴 Adicional (Barba, Hidratação)</option>
                                </select>
                            </div>
                            <div style="display:flex;gap:0.5rem;">
                                <button class="btn btn-primary" onclick="salvarServico()">💾 Salvar</button>
                                <button class="btn btn-secondary" onclick="fecharFormServico()">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB CONFIG -->
                <div class="admin-tab-content" id="tab-config">
                    <div id="horarios-config"><p class="text-muted">Carregando...</p></div>
                    <div id="bloqueios-admin" style="margin-top:1.5rem;"></div>
                </div>
            </div>
        </section>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="/js/api.js"></script>
    <script>
        // ========== TOAST ==========
        function mostrarToast(msg, tipo) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show toast-' + (tipo || 'info');
            clearTimeout(el._timer);
            el._timer = setTimeout(function() { el.classList.remove('show'); }, 4000);
        }

        // ========== LOGIN ==========
        function loginAdmin() {
            var secret = document.getElementById('admin-secret-input').value.trim();
            if (!secret) {
                mostrarToast('Digite a senha.', 'error');
                return;
            }
            // Persistir o secret no localStorage via api.js e também na variável global
            setAdminSecret(secret);
            window.ADMIN_SECRET = secret;
            document.getElementById('login-error').classList.add('hidden');
            fetch('/api/admin/agendamentos?periodo=hoje', {
                headers: { 'x-admin-secret': secret }
            }).then(function(r) {
                if (r.status === 401) throw new Error('Senha inválida');
                return r.json();
            }).then(function() {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('admin-app').classList.remove('hidden');
                initAdmin();
                mostrarToast('✅ Login realizado!', 'success');
            }).catch(function(e) {
                localStorage.removeItem('admin_secret');
                window.ADMIN_SECRET = '';
                document.getElementById('login-error').classList.remove('hidden');
                mostrarToast('❌ Senha incorreta!', 'error');
            });
        }

        function logoutAdmin() {
            localStorage.removeItem('admin_secret');
            window.ADMIN_SECRET = '';
            document.getElementById('admin-app').classList.add('hidden');
            document.getElementById('login-overlay').classList.remove('hidden');
            document.getElementById('admin-secret-input').value = '';
        }

        function initAdmin() {
            carregarAgendamentos('hoje', document.querySelector('#tab-agendamentos .admin-tab'));
        }

        function trocarAba(aba, btn) {
            document.querySelectorAll('.admin-tab[data-tab]').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.admin-tab-content').forEach(function(t) { t.classList.remove('active'); });
            if (btn) btn.classList.add('active');
            document.getElementById('tab-' + aba).classList.add('active');
            if (aba === 'financeiro') carregarFinanceiro('hoje', document.querySelector('#tab-financeiro .admin-tab'));
            if (aba === 'servicos') carregarServicos();
            if (aba === 'config') carregarConfigHorarios();
        }

        function apiUrl(path, query) {
            query = query || '';
            return '/api/admin' + path + (query ? '?' + query : '');
        }
        function apiHeaders() {
            return { 'Content-Type': 'application/json', 'x-admin-secret': localStorage.getItem('admin_secret') || '' };
        }

        // ========== AGENDAMENTOS ==========
        function carregarAgendamentos(periodo, btn) {
            if (btn) {
                document.querySelectorAll('#tab-agendamentos .admin-tab[data-periodo]').forEach(function(t) { t.classList.remove('active'); });
                btn.classList.add('active');
            }
            var list = document.getElementById('agendamentos-list');
            list.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            fetch(apiUrl('/agendamentos', 'periodo=' + periodo), { headers: apiHeaders() })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                var ags = d.agendamentos || [];
                if (ags.length === 0) {
                    list.innerHTML = '<p class="text-muted" style="text-align:center;padding:2rem;">Nenhum agendamento encontrado.</p>';
                    return;
                }
                list.innerHTML = ags.map(function(a) {
                    var dt = new Date(a.data_hora_inicio || a.dataHoraInicio);
                    var status = a.status || 'agendado';
                    var statusClass = status === 'concluido' ? 'badge-success' : status === 'cancelado' ? 'badge-danger' : 'badge-warning';
                    var nomeServico = a.servico_nome || a.servicoNome || a.servico || '—';
                    var id = a.hash_id || a.hashId || a.id || '';
                    var cliente = a.cliente_nome || a.clienteNome || '—';
                    var valor = a.valor_original || a.valor || 0;
                    var tel = a.telefone_contato || a.telefoneContato || '';
                    var nota = a.nota_opcional || a.notaOpcional || '';
                    return '<div class="agendamento-card">' +
                        '<div class="meta"><div class="info">' +
                        '<strong>' + cliente + '</strong> <span class="badge ' + statusClass + '">' + status + '</span>' +
                        '<div style="font-size:0.85rem;color:var(--muted);margin-top:0.25rem;">' +
                        nomeServico + ' — ' + dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) +
                        ' — R$ ' + parseFloat(valor).toFixed(2) +
                        (tel ? '<br>📱 ' + tel : '') +
                        (nota ? '<br>📝 ' + nota : '') +
                        '</div></div>' +
                        '<div class="actions">' +
                        (status === 'agendado' ? '<button class="btn btn-sm btn-success" onclick="atualizarStatus(\'' + id + '\',\'concluido\')">✅ Concluir</button><button class="btn btn-sm btn-danger" onclick="atualizarStatus(\'' + id + '\',\'cancelado\')">❌ Cancelar</button>' : '') +
                        '</div></div></div>';
                }).join('');
            }).catch(function(e) {
                list.innerHTML = '<p class="text-danger">Erro ao carregar: ' + e.message + '</p>';
            });
        }

        function atualizarStatus(id, status) {
            fetch(apiUrl('/agendamentos/' + id), {
                method: 'PUT',
                headers: apiHeaders(),
                body: JSON.stringify({ status: status })
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('✅ Atualizado para ' + status + '!', 'success');
                    var btnAtivo = document.querySelector('#tab-agendamentos .admin-tab.active[data-periodo]');
                    carregarAgendamentos(btnAtivo ? btnAtivo.dataset.periodo : 'hoje', btnAtivo);
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'desconhecido'), 'error');
                }
            }).catch(function(e) { mostrarToast('Erro na requisição', 'error'); });
        }

        // ========== FINANCEIRO ==========
        function carregarFinanceiro(periodo, btn) {
            if (btn) {
                document.querySelectorAll('#tab-financeiro .admin-tab[data-fperiodo]').forEach(function(t) { t.classList.remove('active'); });
                btn.classList.add('active');
            }
            fetch(apiUrl('/financeiro', 'periodo=' + periodo), { headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                document.getElementById('financeiro-stats').innerHTML =
                    '<div class="stat-card"><div class="stat-value">R$ ' + parseFloat(d.totalReceita || 0).toFixed(2) + '</div><div class="stat-label">💰 Receita Total</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + (d.totalAgendamentos || 0) + '</div><div class="stat-label">📋 Agendamentos</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + (d.totalConcluidos || 0) + '</div><div class="stat-label">✅ Concluídos</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + (d.totalCancelados || 0) + '</div><div class="stat-label">❌ Cancelados</div></div>' +
                    '<div class="stat-card"><div class="stat-value">R$ ' + parseFloat(d.totalPago || 0).toFixed(2) + '</div><div class="stat-label">💳 Valor Pago</div></div>' +
                    '<div class="stat-card"><div class="stat-value">R$ ' + parseFloat(d.totalPendente || 0).toFixed(2) + '</div><div class="stat-label">⏳ Pendente</div></div>';
            }).catch(function() {
                document.getElementById('financeiro-stats').innerHTML = '<p class="text-danger">Erro ao carregar financeiro.</p>';
            });
        }

        // ========== SERVIÇOS ==========
        var servicoEditando = null;

        function carregarServicos() {
            var list = document.getElementById('servicos-list');
            list.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            fetch(apiUrl('/servicos'), { headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                var servicos = d.servicos || [];
                if (servicos.length === 0) {
                    list.innerHTML = '<p class="text-muted">Nenhum serviço cadastrado.</p>';
                    return;
                }
                var principais = servicos.filter(function(s) { return s.tipo === 'principal' || !s.tipo; });
                var adicionais = servicos.filter(function(s) { return s.tipo === 'adicional'; });
                var html = '';
                if (principais.length > 0) {
                    html += '<h4 class="servico-categoria">💈 Serviços Principais</h4>';
                    html += principais.map(function(s) { return criarServicoCard(s); }).join('');
                }
                if (adicionais.length > 0) {
                    html += '<h4 class="servico-categoria" style="margin-top:1.5rem;">🧴 Serviços Adicionais</h4>';
                    html += adicionais.map(function(s) { return criarServicoCard(s); }).join('');
                }
                list.innerHTML = html;
            }).catch(function() {
                list.innerHTML = '<p class="text-danger">Erro ao carregar serviços.</p>';
            });
        }

        function criarServicoCard(s) {
            return '<div class="servico-card">' +
                '<div class="meta"><div class="info">' +
                '<strong>' + (s.nome || '') + '</strong> ' + (s.ativo !== false ? '<span class="badge badge-success">Ativo</span>' : '<span class="badge badge-danger">Inativo</span>') +
                '<div style="font-size:0.85rem;color:var(--muted);">' + (s.descricao || '') + ' — ' + (s.duracao_minutos || 0) + 'min — R$ ' + parseFloat(s.valor || 0).toFixed(2) + ' — ' + (s.tipo || 'principal') + '</div>' +
                '</div><div class="actions">' +
                '<button class="btn btn-sm btn-gold" onclick="editarServico(' + s.id + ')">✏️</button>' +
                (s.ativo !== false ? '<button class="btn btn-sm btn-danger" onclick="desativarServico(' + s.id + ')">🗑️</button>' : '<button class="btn btn-sm btn-success" onclick="reativarServico(' + s.id + ')">🔄</button>') +
                '</div></div></div>';
        }

        function mostrarFormServico(dados) {
            dados = dados || null;
            servicoEditando = dados;
            document.getElementById('servico-form').classList.remove('hidden');
            document.getElementById('servico-form-title').textContent = dados ? '✏️ Editar Serviço' : '➕ Novo Serviço';
            document.getElementById('sf-nome').value = dados ? dados.nome || '' : '';
            document.getElementById('sf-descricao').value = dados ? dados.descricao || '' : '';
            document.getElementById('sf-duracao').value = dados ? dados.duracao_minutos || 40 : 40;
            document.getElementById('sf-valor').value = dados ? dados.valor || 50 : 50;
            document.getElementById('sf-tipo').value = dados ? dados.tipo || 'principal' : 'principal';
            document.getElementById('servico-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function fecharFormServico() {
            document.getElementById('servico-form').classList.add('hidden');
            servicoEditando = null;
        }

        function editarServico(id) {
            fetch(apiUrl('/servicos'), { headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                var s = d.servicos.find(function(x) { return x.id === id; });
                if (s) mostrarFormServico(s);
                else mostrarToast('Serviço não encontrado.', 'error');
            }).catch(function() { mostrarToast('Erro ao buscar serviço.', 'error'); });
        }

        function salvarServico() {
            var data = {
                nome: document.getElementById('sf-nome').value,
                descricao: document.getElementById('sf-descricao').value,
                duracaoMinutos: parseInt(document.getElementById('sf-duracao').value) || 40,
                valor: parseFloat(document.getElementById('sf-valor').value) || 0,
                tipo: document.getElementById('sf-tipo').value
            };
            if (!data.nome) { mostrarToast('Nome é obrigatório.', 'error'); return; }
            if (data.valor <= 0) { mostrarToast('Valor deve ser maior que zero.', 'error'); return; }

            var url = servicoEditando ? apiUrl('/servicos/' + servicoEditando.id) : apiUrl('/servicos');
            var method = servicoEditando ? 'PUT' : 'POST';

            fetch(url, { method: method, headers: apiHeaders(), body: JSON.stringify(data) })
            .then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('✅ Serviço salvo com sucesso!', 'success');
                    fecharFormServico();
                    carregarServicos();
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'Erro desconhecido'), 'error');
                }
            }).catch(function() { mostrarToast('Erro de conexão.', 'error'); });
        }

        function desativarServico(id) {
            if (!confirm('Desativar este serviço?')) return;
            fetch(apiUrl('/servicos/' + id), { method: 'DELETE', headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                mostrarToast('✅ Serviço desativado!', 'success');
                carregarServicos();
            }).catch(function() { mostrarToast('Erro ao desativar.', 'error'); });
        }

        function reativarServico(id) {
            fetch(apiUrl('/servicos/' + id + '/reativar'), { method: 'POST', headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                mostrarToast('✅ Serviço reativado!', 'success');
                carregarServicos();
            }).catch(function() { mostrarToast('Erro ao reativar.', 'error'); });
        }

        // ========== CONFIG HORÁRIOS ==========
        function carregarConfigHorarios() {
            var div = document.getElementById('horarios-config');
            div.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            fetch('/api/config/horarios', { headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                var configs = d.configHorarios || [];
                if (configs.length === 0) {
                    div.innerHTML = '<p class="text-muted">Nenhuma configuração encontrada.</p>';
                    return;
                }
                var dias = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
                div.innerHTML = '<h4 style="margin-bottom:1rem;">📅 Horários de Funcionamento</h4>';
                var html = '<div style="display:grid;gap:0.5rem;">';
                configs.forEach(function(h) {
                    var diaNome = h.diaNome || dias[h.dia_semana] || '—';
                    var statusIcon = h.ativo ? '🟢' : '🔴';
                    var horarios = h.ativo ? (h.abertura + ' — ' + h.fechamento + ' (intervalo: ' + h.intervalo_corte_minutos + 'min)') : 'Fechado';
                    html += '<div class="servico-card"><strong>' + statusIcon + ' ' + diaNome + '</strong> <span style="color:var(--muted);margin-left:0.5rem;">' + horarios + '</span></div>';
                });
                html += '</div>';
                div.innerHTML = html;

                // Bloqueios
                carregarBloqueios();
            }).catch(function() {
                div.innerHTML = '<p class="text-danger">Erro ao carregar horários.</p>';
            });
        }

        function carregarBloqueios() {
            var div = document.getElementById('bloqueios-admin');
            div.innerHTML = '<h4 style="margin-bottom:0.5rem;">🚫 Bloqueios de Agenda</h4><p class="text-muted">Carregando...</p>';
            fetch('/api/admin/bloqueios', { headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                var bloqueios = d.bloqueios || [];
                var html = '';
                if (bloqueios.length === 0) {
                    html = '<p class="text-muted">Nenhum bloqueio ativo.</p>';
                } else {
                    html = '<div style="display:grid;gap:0.5rem;">';
                    bloqueios.forEach(function(b) {
                        var dataObj = new Date(b.data + 'T12:00:00');
                        html += '<div class="servico-card"><strong>🚫 ' + dataObj.toLocaleDateString('pt-BR') + '</strong> ' + (b.motivo ? '— ' + b.motivo : '') + '</div>';
                    });
                    html += '</div>';
                }
                div.innerHTML = '<h4 style="margin-bottom:0.5rem;">🚫 Bloqueios de Agenda</h4>' + html;
            }).catch(function() {
                div.innerHTML = '<h4 style="margin-bottom:0.5rem;">🚫 Bloqueios de Agenda</h4><p class="text-danger">Erro ao carregar bloqueios.</p>';
            });
        }

        // Init
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('admin-secret-input').focus();
        });
    </script>
</body>
</html>
