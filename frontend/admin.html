<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Barbe City Jaraguá</title>
    <meta name="description" content="Painel administrativo da Barbe City Jaraguá.">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/img/logo.jpeg" type="image/jpeg">
</head>
<body>
    <!-- Login -->
    <div class="admin-login-overlay" id="login-overlay">
        <div class="card admin-login-card">
            <div class="card-header" style="text-align:center;">
                <div style="font-size:2.5rem;margin-bottom:0.5rem;">🔐</div>
                <span class="card-title">Acesso Admin</span>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <input type="password" id="admin-secret-input" class="form-input" placeholder="Senha secreta" onkeypress="if(event.key==='Enter')loginAdmin()">
                </div>
                <button class="btn btn-primary btn-block" onclick="loginAdmin()">Entrar</button>
                <div id="login-error" class="text-danger text-center hidden" style="margin-top:0.5rem;">Senha inválida.</div>
            </div>
        </div>
    </div>

    <div id="admin-app" class="hidden">
        <nav class="navbar scrolled" id="navbar">
            <div class="container">
                <a href="/" class="navbar-brand">
                    <img src="/img/logo.jpeg" alt="BarbeCuts" class="navbar-logo">
                    <div class="navbar-brand-text">Barbe City<span>Admin</span></div>
                </a>
                <div class="navbar-links">
                    <button class="btn btn-sm" style="background:var(--danger);color:#fff;border:none;padding:0.4rem 1rem;" onclick="logoutAdmin()">🔒 Sair</button>
                </div>
            </div>
        </nav>

        <section class="page-section" style="padding-top:6rem;">
            <div class="container">
                <div class="section-title reveal">
                    <h2>📊 Painel <span class="highlight">Admin</span></h2>
                    <div class="gold-divider"></div>
                </div>

                <!-- Tabs principais -->
                <div class="admin-tabs">
                    <button class="admin-tab active" data-tab="agendamentos" onclick="trocarAba('agendamentos',this)">📅 Agendamentos</button>
                    <button class="admin-tab" data-tab="financeiro" onclick="trocarAba('financeiro',this)">💰 Financeiro</button>
                    <button class="admin-tab" data-tab="servicos" onclick="trocarAba('servicos',this)">✂️ Serviços</button>
                    <button class="admin-tab" data-tab="config" onclick="trocarAba('config',this)">⚙️ Config</button>
                </div>

                <!-- TAB AGENDAMENTOS -->
                <div class="admin-tab-content active" id="tab-agendamentos">
                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem;">
                        <button class="admin-tab active" onclick="carregarAgendamentos('hoje',this)" data-periodo="hoje">📅 Hoje</button>
                        <button class="admin-tab" onclick="carregarAgendamentos('semana',this)" data-periodo="semana">📆 Semana</button>
                        <button class="admin-tab" onclick="carregarAgendamentos('mes',this)" data-periodo="mes">🗓️ Mês</button>
                        <button class="admin-tab" onclick="carregarAgendamentos('todos',this)" data-periodo="todos">📋 Todos</button>
                    </div>
                    <!-- Barra de ações em lote -->
                    <div id="batch-actions" class="hidden" style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem;padding:0.5rem;background:var(--bg-glass);border-radius:var(--radius-md);align-items:center;">
                        <span style="color:var(--text-muted);font-size:0.85rem;"><span id="selected-count">0</span> selecionado(s)</span>
                        <button class="btn btn-sm btn-success" onclick="batchStatus('concluido')" style="font-size:0.8rem;">✅ Concluir</button>
                        <button class="btn btn-sm" style="background:var(--brand-burgundy);color:#fff;border:none;font-size:0.8rem;" onclick="batchStatus('ausente')">❓ Ausente</button>
                        <button class="btn btn-sm btn-danger" onclick="batchStatus('cancelado')" style="font-size:0.8rem;">❌ Cancelar</button>
                        <button class="btn btn-sm" style="background:var(--brand-primary);color:#000;border:none;font-size:0.8rem;" onclick="batchRestituir()">↩️ Restituir</button>
                        <button class="btn btn-sm" style="background:var(--text-muted);color:#fff;border:none;font-size:0.8rem;" onclick="limparSelecao()">✕ Limpar</button>
                    </div>
                    <!-- Botões de limpeza -->
                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem;">
                        <button class="btn btn-sm" style="background:var(--danger);color:#fff;border:none;font-size:0.8rem;" onclick="limparPorStatus('cancelado')">🗑️ Limpar Cancelados</button>
                        <button class="btn btn-sm" style="background:var(--bg-elevated);color:var(--text-muted);border:1px solid var(--border);font-size:0.8rem;" onclick="limparPorStatus('concluido')">🗑️ Limpar Concluídos</button>
                    </div>
                    <div id="agendamentos-list"><p class="text-muted">Carregando...</p></div>
                </div>

                <!-- TAB FINANCEIRO -->
                <div class="admin-tab-content" id="tab-financeiro">
                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;">
                        <button class="admin-tab active" onclick="carregarFinanceiro('hoje',this)" data-fperiodo="hoje">Hoje</button>
                        <button class="admin-tab" onclick="carregarFinanceiro('semana',this)" data-fperiodo="semana">Semana</button>
                        <button class="admin-tab" onclick="carregarFinanceiro('mes',this)" data-fperiodo="mes">Mês</button>
                    </div>
                    <div class="stats-grid" id="financeiro-stats"></div>
                    <div id="financeiro-detalhes" style="margin-top:1rem;"></div>
                </div>

                <!-- TAB SERVIÇOS -->
                <div class="admin-tab-content" id="tab-servicos">
                    <div style="display:flex;gap:1rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap;">
                        <button class="btn btn-primary" onclick="mostrarFormServico()">➕ Novo Serviço</button>
                        <button class="btn btn-sm" style="background:var(--border);color:var(--light);" onclick="carregarServicos()">🔄 Atualizar</button>
                    </div>
                    <div id="servicos-list"><p class="text-muted">Carregando...</p></div>
                    <div id="servico-form" class="card hidden" style="max-width:500px;margin-top:1rem;">
                        <div class="card-header"><span class="card-title" id="servico-form-title">Novo Serviço</span></div>
                        <div class="card-body">
                            <div class="form-group">
                                <label class="form-label">Nome</label>
                                <input type="text" id="sf-nome" class="form-input" placeholder="Corte Degradê">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Descrição</label>
                                <input type="text" id="sf-descricao" class="form-input" placeholder="Corte degradê com navalha">
                            </div>
                            <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                                <div class="form-group">
                                    <label class="form-label">Duração (min)</label>
                                    <input type="number" id="sf-duracao" class="form-input" value="40">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Valor (R$)</label>
                                    <input type="number" id="sf-valor" class="form-input" step="0.01" value="50">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Categoria / Tipo</label>
                                <select id="sf-tipo" class="form-input">
                                    <option value="principal">💈 Principal (Corte)</option>
                                    <option value="adicional">🧴 Adicional (Barba, Hidratação)</option>
                                </select>
                            </div>
                            <div style="display:flex;gap:0.5rem;">
                                <button class="btn btn-primary" onclick="salvarServico()">💾 Salvar</button>
                                <button class="btn btn-secondary" onclick="fecharFormServico()">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB CONFIG -->
                <div class="admin-tab-content" id="tab-config">
                    <div id="horarios-config"><p class="text-muted">Carregando...</p></div>
                    <div id="bloqueios-admin" style="margin-top:1.5rem;"></div>
                </div>
            </div>
        </section>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="/js/api.js"></script>
    <script>
        // ========== TOAST ==========
        function mostrarToast(msg, tipo) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show toast-' + (tipo || 'info');
            clearTimeout(el._timer);
            el._timer = setTimeout(function() { el.classList.remove('show'); }, 4000);
        }

        // ========== LOGIN ==========
        function loginAdmin() {
            var secret = document.getElementById('admin-secret-input').value.trim();
            if (!secret) {
                mostrarToast('Digite a senha.', 'error');
                return;
            }
            setAdminSecret(secret);
            window.ADMIN_SECRET = secret;
            document.getElementById('login-error').classList.add('hidden');
            fetch('/api/admin/agendamentos?periodo=hoje', {
                headers: { 'x-admin-secret': secret }
            }).then(function(r) {
                if (r.status === 401) throw new Error('Senha inválida');
                return r.json();
            }).then(function() {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('admin-app').classList.remove('hidden');
                initAdmin();
                mostrarToast('✅ Login realizado!', 'success');
            }).catch(function(e) {
                localStorage.removeItem('admin_secret');
                window.ADMIN_SECRET = '';
                document.getElementById('login-error').classList.remove('hidden');
                mostrarToast('❌ Senha incorreta!', 'error');
            });
        }

        function logoutAdmin() {
            localStorage.removeItem('admin_secret');
            window.ADMIN_SECRET = '';
            document.getElementById('admin-app').classList.add('hidden');
            document.getElementById('login-overlay').classList.remove('hidden');
            document.getElementById('admin-secret-input').value = '';
        }

        function initAdmin() {
            carregarAgendamentos('hoje', document.querySelector('#tab-agendamentos .admin-tab'));
        }

        function trocarAba(aba, btn) {
            document.querySelectorAll('.admin-tab[data-tab]').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.admin-tab-content').forEach(function(t) { t.classList.remove('active'); });
            if (btn) btn.classList.add('active');
            document.getElementById('tab-' + aba).classList.add('active');
            if (aba === 'financeiro') carregarFinanceiro('hoje', document.querySelector('#tab-financeiro .admin-tab'));
            if (aba === 'servicos') carregarServicos();
            if (aba === 'config') carregarConfigHorarios();
        }

        function apiUrl(path, query) {
            query = query || '';
            return '/api/admin' + path + (query ? '?' + query : '');
        }
        function apiHeaders() {
            return { 'Content-Type': 'application/json', 'x-admin-secret': localStorage.getItem('admin_secret') || '' };
        }

        // ========== VARIÁVEL DE SELEÇÃO ==========
        var selecionados = {};

        function atualizarContadorSelecao() {
            var ids = Object.keys(selecionados);
            var count = ids.length;
            document.getElementById('selected-count').textContent = count;
            var el = document.getElementById('batch-actions');
            if (count > 0) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function toggleSelecao(id) {
            if (selecionados[id]) {
                delete selecionados[id];
            } else {
                selecionados[id] = true;
            }
            atualizarContadorSelecao();
        }

        function limparSelecao() {
            selecionados = {};
            atualizarContadorSelecao();
            document.querySelectorAll('.agendamento-checkbox').forEach(function(cb) {
                cb.checked = false;
            });
        }

        // ========== AGENDAMENTOS ==========
        function carregarAgendamentos(periodo, btn) {
            if (btn) {
                document.querySelectorAll('#tab-agendamentos .admin-tab[data-periodo]').forEach(function(t) { t.classList.remove('active'); });
                btn.classList.add('active');
            }
            limparSelecao();
            var list = document.getElementById('agendamentos-list');
            list.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            fetch(apiUrl('/agendamentos', 'periodo=' + periodo), { headers: apiHeaders() })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                var ags = d.agendamentos || [];
                if (ags.length === 0) {
                    list.innerHTML = '<p class="text-muted" style="text-align:center;padding:2rem;">Nenhum agendamento encontrado.</p>';
                    return;
                }
                list.innerHTML = ags.map(function(a) {
                    var dt = new Date(a.data_hora_inicio || a.dataHoraInicio);
                    var status = a.status || 'agendado';
                    var statusClass = status === 'concluido' ? 'badge-success' : status === 'cancelado' ? 'badge-danger' : 'badge-warning';
                    var nomeServico = a.servico_nome || a.servicoNome || a.servico || '—';
                    var id = a.hash_id || a.hashId || a.id || '';
                    var cliente = a.cliente_nome || a.clienteNome || '—';
                    var valor = a.valor_original || a.valor || 0;
                    var tel = a.telefone_contato || a.telefoneContato || '';
                    var nota = a.nota_opcional || a.notaOpcional || '';
                    var botoes = '';
                    if (status === 'agendado') {
                        botoes = '<button class="btn btn-sm btn-success" onclick="atualizarStatus(\'' + id + '\',\'concluido\')">✅ Concluir</button>' +
                                 '<button class="btn btn-sm" style="background:var(--brand-burgundy);color:#fff;border:none;" onclick="atualizarStatus(\'' + id + '\',\'ausente\')">❓ Ausente</button>' +
                                 '<button class="btn btn-sm btn-danger" onclick="atualizarStatus(\'' + id + '\',\'cancelado\')">❌ Cancelar</button>';
                    } else if (status === 'cancelado') {
                        botoes = '<button class="btn btn-sm" style="background:var(--brand-primary);color:#000;border:none;" onclick="atualizarStatus(\'' + id + '\',\'agendado\')">↩️ Restituir</button>';
                    } else if (status === 'ausente') {
                        botoes = '<button class="btn btn-sm btn-success" onclick="atualizarStatus(\'' + id + '\',\'concluido\')">✅ Concluir</button>' +
                                 '<button class="btn btn-sm btn-danger" onclick="atualizarStatus(\'' + id + '\',\'cancelado\')">❌ Cancelar</button>';
                    } else if (status === 'concluido') {
                        botoes = '<button class="btn btn-sm" style="background:var(--brand-primary);color:#000;border:none;" onclick="atualizarStatus(\'' + id + '\',\'agendado\')">↩️ Reabrir</button>';
                    }
                    return '<div class="agendamento-card">' +
                        '<div style="display:flex;align-items:flex-start;gap:0.5rem;">' +
                        '<input type="checkbox" class="agendamento-checkbox" style="margin-top:0.3rem;accent-color:var(--brand-primary);" onchange="toggleSelecao(\'' + id + '\')">' +
                        '<div class="meta" style="flex:1;"><div class="info">' +
                        '<strong>' + cliente + '</strong> <span class="badge ' + statusClass + '">' + status + '</span>' +
                        '<div style="font-size:0.85rem;color:var(--muted);margin-top:0.25rem;">' +
                        nomeServico + ' — ' + dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) +
                        ' — R$ ' + parseFloat(valor).toFixed(2) +
                        (tel ? '<br>📱 ' + tel : '') +
                        (nota ? '<br>📝 ' + nota : '') +
                        '</div></div>' +
                        '<div class="actions">' + botoes + '</div></div></div></div>';
                }).join('');
            }).catch(function(e) {
                list.innerHTML = '<p class="text-danger">Erro ao carregar: ' + e.message + '</p>';
            });
        }

        function atualizarStatus(id, status) {
            fetch(apiUrl('/agendamentos/' + id), {
                method: 'PUT',
                headers: apiHeaders(),
                body: JSON.stringify({ status: status })
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('✅ Atualizado para ' + status + '!', 'success');
                    var btnAtivo = document.querySelector('#tab-agendamentos .admin-tab.active[data-periodo]');
                    carregarAgendamentos(btnAtivo ? btnAtivo.dataset.periodo : 'hoje', btnAtivo);
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'desconhecido'), 'error');
                }
            }).catch(function(e) { mostrarToast('Erro na requisição', 'error'); });
        }

        // ========== AÇÕES EM LOTE ==========
        function batchStatus(status) {
            var ids = Object.keys(selecionados);
            if (ids.length === 0) {
                mostrarToast('Selecione pelo menos um agendamento.', 'error');
                return;
            }
            if (!confirm('Alterar ' + ids.length + ' agendamento(s) para "' + status + '"?')) return;
            fetch('/api/admin/agendamentos/batch', {
                method: 'POST',
                headers: apiHeaders(),
                body: JSON.stringify({ ids: ids, status: status })
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('✅ ' + d.atualizados + ' agendamento(s) atualizado(s)!', 'success');
                    limparSelecao();
                    var btnAtivo = document.querySelector('#tab-agendamentos .admin-tab.active[data-periodo]');
                    carregarAgendamentos(btnAtivo ? btnAtivo.dataset.periodo : 'hoje', btnAtivo);
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'desconhecido'), 'error');
                }
            }).catch(function() { mostrarToast('Erro na requisição em lote.', 'error'); });
        }

        function batchRestituir() {
            var ids = Object.keys(selecionados);
            if (ids.length === 0) {
                mostrarToast('Selecione pelo menos um agendamento.', 'error');
                return;
            }
            if (!confirm('Restituir ' + ids.length + ' agendamento(s) para "agendado"?')) return;
            fetch('/api/admin/agendamentos/batch', {
                method: 'POST',
                headers: apiHeaders(),
                body: JSON.stringify({ ids: ids, status: 'agendado' })
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('✅ ' + d.atualizados + ' agendamento(s) restituído(s)!', 'success');
                    limparSelecao();
                    var btnAtivo = document.querySelector('#tab-agendamentos .admin-tab.active[data-periodo]');
                    carregarAgendamentos(btnAtivo ? btnAtivo.dataset.periodo : 'hoje', btnAtivo);
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'desconhecido'), 'error');
                }
            }).catch(function() { mostrarToast('Erro na requisição em lote.', 'error'); });
        }

        function limparPorStatus(status) {
            var label = status === 'cancelado' ? 'cancelados' : 'concluídos';
            if (!confirm('Tem certeza que deseja remover TODOS os agendamentos ' + label + '?')) return;
            fetch('/api/admin/agendamentos/limpar/' + status, {
                method: 'DELETE',
                headers: apiHeaders()
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('🗑️ ' + d.removidos + ' agendamento(s) removido(s)!', 'success');
                    var btnAtivo = document.querySelector('#tab-agendamentos .admin-tab.active[data-periodo]');
                    carregarAgendamentos(btnAtivo ? btnAtivo.dataset.periodo : 'hoje', btnAtivo);
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'desconhecido'), 'error');
                }
            }).catch(function() { mostrarToast('Erro na requisição.', 'error'); });
        }

        // ========== FINANCEIRO ==========
        function carregarFinanceiro(periodo, btn) {
            if (btn) {
                document.querySelectorAll('#tab-financeiro .admin-tab[data-fperiodo]').forEach(function(t) { t.classList.remove('active'); });
                btn.classList.add('active');
            }
            fetch(apiUrl('/financeiro', 'periodo=' + periodo), { headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                document.getElementById('financeiro-stats').innerHTML =
                    '<div class="stat-card"><div class="stat-value">R$ ' + parseFloat(d.totalReceita || 0).toFixed(2) + '</div><div class="stat-label">💰 Receita Total</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + (d.totalAgendamentos || 0) + '</div><div class="stat-label">📋 Agendamentos</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + (d.totalConcluidos || 0) + '</div><div class="stat-label">✅ Concluídos</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + (d.totalCancelados || 0) + '</div><div class="stat-label">❌ Cancelados</div></div>' +
                    '<div class="stat-card"><div class="stat-value">R$ ' + parseFloat(d.totalPago || 0).toFixed(2) + '</div><div class="stat-label">💳 Valor Pago</div></div>' +
                    '<div class="stat-card"><div class="stat-value">R$ ' + parseFloat(d.totalPendente || 0).toFixed(2) + '</div><div class="stat-label">⏳ Pendente</div></div>';
            }).catch(function() {
                document.getElementById('financeiro-stats').innerHTML = '<p class="text-danger">Erro ao carregar financeiro.</p>';
            });
        }

        // ========== SERVIÇOS ==========
        var servicoEditando = null;

        function carregarServicos() {
            var list = document.getElementById('servicos-list');
            list.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            fetch(apiUrl('/servicos'), { headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                var servicos = d.servicos || [];
                if (servicos.length === 0) {
                    list.innerHTML = '<p class="text-muted">Nenhum serviço cadastrado.</p>';
                    return;
                }
                var principais = servicos.filter(function(s) { return s.tipo === 'principal' || !s.tipo; });
                var adicionais = servicos.filter(function(s) { return s.tipo === 'adicional'; });
                var inativos = servicos.filter(function(s) { return s.ativo == 0; });
                var html = '';
                if (principais.length > 0) {
                    html += '<h4 class="servico-categoria">💈 Serviços Principais</h4>';
                    html += principais.map(function(s) { return criarServicoCard(s); }).join('');
                }
                if (adicionais.length > 0) {
                    html += '<h4 class="servico-categoria" style="margin-top:1.5rem;">🧴 Serviços Adicionais</h4>';
                    html += adicionais.map(function(s) { return criarServicoCard(s); }).join('');
                }
                if (inativos.length > 0) {
                    html += '<h4 class="servico-categoria" style="margin-top:1.5rem;color:var(--danger);">⚠️ Serviços Inativos</h4>';
                    html += inativos.map(function(s) { return criarServicoCard(s); }).join('');
                }
                list.innerHTML = html;
            }).catch(function() {
                list.innerHTML = '<p class="text-danger">Erro ao carregar serviços.</p>';
            });
        }

        function criarServicoCard(s) {
            return '<div class="servico-card">' +
                '<div class="meta"><div class="info">' +
                '<strong>' + (s.nome || '') + '</strong> ' + (s.ativo == 1 ? '<span class="badge badge-success">Ativo</span>' : '<span class="badge badge-danger">Inativo</span>') +
                '<div style="font-size:0.85rem;color:var(--muted);">' + (s.descricao || '') + ' — ' + (s.duracao_minutos || 0) + 'min — R$ ' + parseFloat(s.valor || 0).toFixed(2) + ' — ' + (s.tipo || 'principal') + '</div>' +
                '</div><div class="actions">' +
                '<button class="btn btn-sm btn-gold" onclick="editarServico(' + s.id + ')">✏️</button>' +
                (s.ativo == 1 ? '<button class="btn btn-sm btn-danger" onclick="desativarServico(' + s.id + ')">🗑️</button>' : '<button class="btn btn-sm btn-success" onclick="reativarServico(' + s.id + ')">🔄</button><button class="btn btn-sm" style="background:var(--danger);color:#fff;border:none;" onclick="excluirServicoPermanentemente(' + s.id + ')">❌ Excluir</button>') +
                '</div></div></div>';
        }

        function mostrarFormServico(dados) {
            dados = dados || null;
            servicoEditando = dados;
            document.getElementById('servico-form').classList.remove('hidden');
            document.getElementById('servico-form-title').textContent = dados ? '✏️ Editar Serviço' : '➕ Novo Serviço';
            document.getElementById('sf-nome').value = dados ? dados.nome || '' : '';
            document.getElementById('sf-descricao').value = dados ? dados.descricao || '' : '';
            document.getElementById('sf-duracao').value = dados ? dados.duracao_minutos || 40 : 40;
            document.getElementById('sf-valor').value = dados ? dados.valor || 50 : 50;
            document.getElementById('sf-tipo').value = dados ? dados.tipo || 'principal' : 'principal';
            document.getElementById('servico-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function fecharFormServico() {
            document.getElementById('servico-form').classList.add('hidden');
            servicoEditando = null;
        }

        function editarServico(id) {
            fetch(apiUrl('/servicos'), { headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                var s = d.servicos.find(function(x) { return x.id === id; });
                if (s) mostrarFormServico(s);
                else mostrarToast('Serviço não encontrado.', 'error');
            }).catch(function() { mostrarToast('Erro ao buscar serviço.', 'error'); });
        }

        function salvarServico() {
            var data = {
                nome: document.getElementById('sf-nome').value,
                descricao: document.getElementById('sf-descricao').value,
                duracaoMinutos: parseInt(document.getElementById('sf-duracao').value) || 40,
                valor: parseFloat(document.getElementById('sf-valor').value) || 0,
                tipo: document.getElementById('sf-tipo').value
            };
            if (!data.nome) { mostrarToast('Nome é obrigatório.', 'error'); return; }
            if (data.valor <= 0) { mostrarToast('Valor deve ser maior que zero.', 'error'); return; }

            var url = servicoEditando ? apiUrl('/servicos/' + servicoEditando.id) : apiUrl('/servicos');
            var method = servicoEditando ? 'PUT' : 'POST';

            fetch(url, { method: method, headers: apiHeaders(), body: JSON.stringify(data) })
            .then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('✅ Serviço salvo com sucesso!', 'success');
                    fecharFormServico();
                    carregarServicos();
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'Erro desconhecido'), 'error');
                }
            }).catch(function() { mostrarToast('Erro de conexão.', 'error'); });
        }

        function desativarServico(id) {
            if (!confirm('Desativar este serviço?')) return;
            fetch(apiUrl('/servicos/' + id), { method: 'DELETE', headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                mostrarToast('✅ Serviço desativado!', 'success');
                carregarServicos();
            }).catch(function() { mostrarToast('Erro ao desativar.', 'error'); });
        }

        function reativarServico(id) {
            fetch(apiUrl('/servicos/' + id + '/reativar'), { method: 'POST', headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                mostrarToast('✅ Serviço reativado!', 'success');
                carregarServicos();
            }).catch(function() { mostrarToast('Erro ao reativar.', 'error'); });
        }

        function excluirServicoPermanentemente(id) {
            if (!confirm('⚠️ Tem certeza que deseja EXCLUIR PERMANENTEMENTE este serviço? Esta ação não pode ser desfeita.')) return;
            fetch('/api/admin/servicos/' + id + '/permanentemente', {
                method: 'DELETE',
                headers: { 'x-admin-secret': localStorage.getItem('admin_secret') || '' }
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('🗑️ Serviço excluído permanentemente!', 'success');
                    carregarServicos();
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'desconhecido'), 'error');
                }
            }).catch(function() { mostrarToast('Erro ao excluir serviço.', 'error'); });
        }

        // ========== CONFIG HORÁRIOS (INTERATIVO) ==========
        function carregarConfigHorarios() {
            var div = document.getElementById('horarios-config');
            div.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            fetch('/api/config/horarios', { headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                var configs = d.configHorarios || [];
                if (configs.length === 0) {
                    div.innerHTML = '<p class="text-muted">Nenhuma configuração encontrada.</p>';
                    return;
                }
                var dias = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];
                div.innerHTML = '<h4 style="margin-bottom:1rem;">📅 Horários de Funcionamento</h4>' +
                    '<p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.75rem;">Clique em 🟢/🔴 para ativar/desativar. Edite os horários e clique em 💾 para salvar.</p>';
                var html = '<div style="display:grid;gap:0.5rem;">';
                configs.forEach(function(h) {
                    var ativo = h.ativo ? true : false;
                    html += '<div class="servico-card" style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">' +
                        '<button style="background:none;border:none;font-size:1.3rem;cursor:pointer;" onclick="toggleDia(' + h.dia_semana + ',' + (ativo ? '0' : '1') + ')" title="Clique para ' + (ativo ? 'desativar' : 'ativar') + '">' + (ativo ? '🟢' : '🔴') + '</button>' +
                        '<strong style="min-width:110px;">' + dias[h.dia_semana] + '</strong>' +
                        (ativo ?
                            '<input type="time" id="abertura-' + h.dia_semana + '" value="' + h.abertura + '" style="background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.25rem 0.4rem;width:90px;">' +
                            '<span style="color:var(--text-muted);">—</span>' +
                            '<input type="time" id="fechamento-' + h.dia_semana + '" value="' + h.fechamento + '" style="background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.25rem 0.4rem;width:90px;">' +
                            '<button class="btn btn-sm" style="background:var(--brand-primary);color:#000;border:none;font-size:0.75rem;padding:0.2rem 0.5rem;" onclick="salvarHorarioDia(' + h.dia_semana + ')">💾</button>'
                        : '<span style="color:var(--text-muted);font-size:0.85rem;">Fechado</span>') +
                        '</div>';
                });
                html += '</div>';
                div.innerHTML = html;
                carregarBloqueios();
            }).catch(function() {
                div.innerHTML = '<p class="text-danger">Erro ao carregar horários.</p>';
            });
        }

        function toggleDia(diaSemana, novoAtivo) {
            fetch('/api/config/horarios/' + diaSemana, {
                method: 'PUT',
                headers: apiHeaders(),
                body: JSON.stringify({ ativo: novoAtivo === 1 })
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('✅ Dia ' + (novoAtivo ? 'ativado!' : 'desativado!'), 'success');
                    carregarConfigHorarios();
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'desconhecido'), 'error');
                }
            }).catch(function() { mostrarToast('Erro ao atualizar.', 'error'); });
        }

        function salvarHorarioDia(diaSemana) {
            var abertura = document.getElementById('abertura-' + diaSemana).value;
            var fechamento = document.getElementById('fechamento-' + diaSemana).value;
            if (!abertura || !fechamento) {
                mostrarToast('Preencha abertura e fechamento.', 'error');
                return;
            }
            fetch('/api/config/horarios/' + diaSemana, {
                method: 'PUT',
                headers: apiHeaders(),
                body: JSON.stringify({ abertura: abertura, fechamento: fechamento })
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('✅ Horário salvo!', 'success');
                    carregarConfigHorarios();
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'desconhecido'), 'error');
                }
            }).catch(function() { mostrarToast('Erro ao salvar.', 'error'); });
        }

        // ========== BLOQUEIOS (CRUD) ==========
        function mostrarFormBloqueio() {
            document.getElementById('bloqueio-form').classList.remove('hidden');
            document.getElementById('bl-tipo').value = 'dia';
            document.getElementById('bl-data').value = '';
            document.getElementById('bl-datafim').value = '';
            document.getElementById('bl-horainicio').value = '';
            document.getElementById('bl-horafim').value = '';
            document.getElementById('bl-motivo').value = '';
            toggleTipoBloqueio();
            document.getElementById('bloqueio-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function fecharFormBloqueio() {
            document.getElementById('bloqueio-form').classList.add('hidden');
        }

        function toggleTipoBloqueio() {
            var tipo = document.getElementById('bl-tipo').value;
            document.getElementById('bl-data-group').classList.remove('hidden');
            document.getElementById('bl-data-label').textContent = tipo === 'range' ? 'Data início' : 'Data';
            document.getElementById('bl-datafim-group').classList.toggle('hidden', tipo !== 'range');
            document.getElementById('bl-horainicio-group').classList.toggle('hidden', tipo !== 'horario');
            document.getElementById('bl-horafim-group').classList.toggle('hidden', tipo !== 'horario');
        }

        function salvarBloqueio() {
            var tipo = document.getElementById('bl-tipo').value;
            var data = document.getElementById('bl-data').value;
            var dataFim = document.getElementById('bl-datafim').value;
            var horaInicio = document.getElementById('bl-horainicio').value;
            var horaFim = document.getElementById('bl-horafim').value;
            var motivo = document.getElementById('bl-motivo').value.trim();

            if (!data) { mostrarToast('Selecione uma data.', 'error'); return; }

            var payload = { data: data, motivo: motivo };
            if (tipo === 'range') {
                if (!dataFim) { mostrarToast('Selecione a data fim.', 'error'); return; }
                payload.dataFim = dataFim;
            }
            if (tipo === 'horario') {
                if (!horaInicio || !horaFim) { mostrarToast('Preencha hora início e fim.', 'error'); return; }
                payload.horaInicio = horaInicio;
                payload.horaFim = horaFim;
            }

            fetch('/api/admin/bloqueios', {
                method: 'POST',
                headers: apiHeaders(),
                body: JSON.stringify(payload)
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('✅ Bloqueio criado!', 'success');
                    fecharFormBloqueio();
                    carregarBloqueios();
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'desconhecido'), 'error');
                }
            }).catch(function() { mostrarToast('Erro ao criar bloqueio.', 'error'); });
        }

        function removerBloqueio(id) {
            if (!confirm('Remover este bloqueio?')) return;
            fetch('/api/admin/bloqueios/' + id, {
                method: 'DELETE',
                headers: apiHeaders()
            }).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) {
                    mostrarToast('🗑️ Bloqueio removido!', 'success');
                    carregarBloqueios();
                } else {
                    mostrarToast('Erro: ' + (d.erro || 'desconhecido'), 'error');
                }
            }).catch(function() { mostrarToast('Erro ao remover.', 'error'); });
        }

        function carregarBloqueios() {
            var div = document.getElementById('bloqueios-admin');
            div.innerHTML = '<h4 style="margin-bottom:0.5rem;">🚫 Bloqueios de Agenda</h4>' +
                '<div style="margin-bottom:0.75rem;">' +
                '<button class="btn btn-sm btn-primary" onclick="mostrarFormBloqueio()">➕ Novo Bloqueio</button>' +
                '<button class="btn btn-sm" style="background:var(--border);color:var(--light);margin-left:0.5rem;" onclick="carregarBloqueios()">🔄</button>' +
                '</div>' +
                '<div id="bloqueio-form" class="card hidden" style="max-width:500px;margin-bottom:1rem;">' +
                '<div class="card-header"><span class="card-title">🚫 Novo Bloqueio</span></div>' +
                '<div class="card-body">' +
                '<div class="form-group"><label class="form-label">Tipo</label>' +
                '<select id="bl-tipo" class="form-input" onchange="toggleTipoBloqueio()">' +
                '<option value="dia">📅 Dia específico</option>' +
                '<option value="range">📅 Período / Férias</option>' +
                '<option value="horario">⏰ Horário específico</option>' +
                '</select></div>' +
                '<div class="form-group" id="bl-data-group"><label class="form-label" id="bl-data-label">Data</label>' +
                '<input type="date" id="bl-data" class="form-input"></div>' +
                '<div class="form-group hidden" id="bl-datafim-group"><label class="form-label">Data fim</label>' +
                '<input type="date" id="bl-datafim" class="form-input"></div>' +
                '<div class="form-group hidden" id="bl-horainicio-group"><label class="form-label">Hora início</label>' +
                '<input type="time" id="bl-horainicio" class="form-input"></div>' +
                '<div class="form-group hidden" id="bl-horafim-group"><label class="form-label">Hora fim</label>' +
                '<input type="time" id="bl-horafim" class="form-input"></div>' +
                '<div class="form-group"><label class="form-label">Motivo (opcional)</label>' +
                '<input type="text" id="bl-motivo" class="form-input" placeholder="Férias, feriado, manutenção..."></div>' +
                '<div style="display:flex;gap:0.5rem;">' +
                '<button class="btn btn-primary" onclick="salvarBloqueio()">💾 Salvar</button>' +
                '<button class="btn btn-secondary" onclick="fecharFormBloqueio()">Cancelar</button></div>' +
                '</div></div>' +
                '<div id="bloqueios-list"><p class="text-muted">Carregando...</p></div>';
            fetch('/api/admin/bloqueios', { headers: apiHeaders() })
            .then(function(r) { return r.json(); }).then(function(d) {
                var bloqueios = d.bloqueios || [];
                var html = '';
                if (bloqueios.length === 0) {
                    html = '<p class="text-muted">Nenhum bloqueio ativo.</p>';
                } else {
                    html = '<div style="display:grid;gap:0.5rem;">';
                    bloqueios.forEach(function(b) {
                        var dataObj = new Date(b.data + 'T12:00:00');
                        var desc = dataObj.toLocaleDateString('pt-BR');
                        if (b.data_fim) {
                            var dataFimObj = new Date(b.data_fim + 'T12:00:00');
                            desc += ' — ' + dataFimObj.toLocaleDateString('pt-BR');
                        }
                        if (b.hora_inicio && b.hora_fim) {
                            desc += ' | ' + b.hora_inicio.slice(0,5) + ' às ' + b.hora_fim.slice(0,5);
                        }
                        html += '<div class="servico-card" style="display:flex;align-items:center;gap:0.5rem;">' +
                            '<strong style="flex:1;">🚫 ' + desc + '</strong>' +
                            (b.motivo ? '<span style="color:var(--text-muted);font-size:0.85rem;">— ' + b.motivo + '</span>' : '') +
                            '<button class="btn btn-sm btn-danger" onclick="removerBloqueio(\'' + b.id + '\')">🗑️</button>' +
                            '</div>';
                    });
                    html += '</div>';
                }
                document.getElementById('bloqueios-list').innerHTML = html;
            }).catch(function() {
                document.getElementById('bloqueios-list').innerHTML = '<p class="text-danger">Erro ao carregar bloqueios.</p>';
            });
        }

        // Init
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('admin-secret-input').focus();
        });
    </script>
</body>
</html>
